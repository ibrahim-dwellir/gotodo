openapi: 3.0.3
info:
  title: GoTodo API
  version: 1.0.0
  description: |
    A small todo service. Register, log in to get a bearer token, then click
    **Authorize** and paste the token to call the todo endpoints.
    Each user can only see and modify their own todos; another user's todo
    returns 404.
servers:
  - url: /
tags:
  - name: auth
  - name: users
  - name: todos
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in and obtain a bearer token
      description: Records the login time in the user's `last_login_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/users/me:
    get:
      tags: [users]
      summary: Get the current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [users]
      summary: Update the current user's name
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/todos:
    get:
      tags: [todos]
      summary: List the current user's todos
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Status" }
      responses:
        "200":
          description: Todos, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Todo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [todos]
      summary: Create a todo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTodoRequest" }
      responses:
        "201":
          description: Todo created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Todo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [todos]
      summary: Get one todo
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The todo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Todo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [todos]
      summary: Replace a todo
      description: Full replacement. `title` and `status` are required; omitting `due_date` or sending null clears it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTodoRequest" }
      responses:
        "200":
          description: Updated todo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Todo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [todos]
      summary: Delete a todo
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Todo does not exist or belongs to another user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: title is required }

    Status:
      type: string
      enum: [not_started, in_progress, in_review, completed]

    User:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        first_name: { type: string, example: Ada }
        last_name: { type: string, example: Lovelace }
        email: { type: string, format: email, example: ada@example.com }
        last_login_at:
          type: string
          format: date-time
          nullable: true
          description: When the user last logged in; null until the first login.
        created_at:
          type: string
          format: date-time
          description: When the user registered.
        updated_at:
          type: string
          format: date-time
          description: When the user's profile was last modified.

    RegisterRequest:
      type: object
      required: [first_name, last_name, email, password]
      properties:
        first_name: { type: string, maxLength: 100, example: Ada }
        last_name: { type: string, maxLength: 100, example: Lovelace }
        email: { type: string, format: email, example: ada@example.com }
        password: { type: string, format: password, minLength: 8, maxLength: 72, example: correct-horse }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: ada@example.com }
        password: { type: string, format: password, example: correct-horse }

    UpdateMeRequest:
      type: object
      required: [first_name, last_name]
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: "JWT to send as `Authorization: Bearer <token>`"
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    Todo:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        user_id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: Write the report }
        description: { type: string, example: Include Q3 numbers }
        status: { $ref: "#/components/schemas/Status" }
        due_date: { type: string, format: date, nullable: true, example: "2026-12-01" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateTodoRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200, example: Write the report }
        description: { type: string, maxLength: 5000, example: Include Q3 numbers }
        status:
          allOf: [{ $ref: "#/components/schemas/Status" }]
          description: Defaults to not_started.
        due_date: { type: string, format: date, nullable: true, example: "2026-12-01" }

    UpdateTodoRequest:
      type: object
      required: [title, status]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        status: { $ref: "#/components/schemas/Status" }
        due_date: { type: string, format: date, nullable: true }
